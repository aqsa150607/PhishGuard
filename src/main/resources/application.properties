spring.application.name=phishguard

# ---- MySQL (change the password to yours) ----
spring.datasource.url=jdbc:mysql://localhost:3306/phishguard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=USE_PASSWORD

# ---- JPA: create/update tables automatically ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Scoring points (change these to tune the algorithm) ----
phishguard.score.no-https=15
phishguard.score.ip-address=25
phishguard.score.long-url=10
phishguard.score.many-subdomains=10
phishguard.score.suspicious-chars=10
phishguard.score.at-symbol=20
phishguard.score.many-hyphens=10
phishguard.score.encoded-chars=10
phishguard.score.keyword=10
phishguard.score.suspicious-domain=10
phishguard.score.misleading-domain=15
phishguard.score.port=10
phishguard.score.many-params=5
phishguard.score.suspicious-tld=15

# ---- Risk level thresholds ----
phishguard.level.medium=30
phishguard.level.high=60
phishguard.level.critical=80